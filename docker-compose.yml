services:

  global:
    image: nginx:alpine
    container_name: geoip-global
    volumes:
      - ./global:/usr/share/nginx/html:ro
    networks:
      - geoip-network

  india:
    image: nginx:alpine
    container_name: geoip-india
    volumes:
      - ./india:/usr/share/nginx/html:ro
    networks:
      - geoip-network

  usa:
    image: nginx:alpine
    container_name: geoip-usa
    volumes:
      - ./usa:/usr/share/nginx/html:ro
    networks:
      - geoip-network

  app :
    build:
      context: .
      dockerfile: Dockerfile
    image: geoip-docker-app:latest
    container_name: geoip-app
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./geoip/GeoLite2-Country.mmdb:/etc/nginx/geoip/GeoLite2-Country.mmdb:ro
    depends_on:
      - global
      - india
      - usa
    networks:
      - geoip-network

networks:
  geoip-network:
    driver: bridge